<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de contactos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Registro de contactos</h1>
    <p class="intro">Completa el formulario y tus datos quedarán guardados.</p>

    <form id="formulario" novalidate>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" required>

      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" name="telefono">

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="3"></textarea>

      <button type="submit" id="btn">Guardar datos</button>
      <p id="estado" role="status"></p>
    </form>

    <h2>Registros guardados</h2>
    <ul id="lista"><li class="vacio">Aún no hay registros.</li></ul>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
